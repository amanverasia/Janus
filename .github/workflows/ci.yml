name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json

      - name: Dashboard bundle check
        run: python scripts/build_dashboard_ui.py --check

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/janus/ tests/

      - name: Ruff format check
        run: ruff format --check src/janus/ tests/

      - name: Mypy
        run: mypy src/janus/

      - name: Pytest
        run: python -m pytest -q

      - name: Docs build (strict)
        run: mkdocs build --strict
