# Reusable check suite. ci.yml runs it on push/PR; publish.yml runs it before
# releasing, so a tag cannot ship without the same gate a PR faces.
name: Checks

on:
  workflow_call:
    inputs:
      coverage-threshold:
        # Measured 83% across 15,469 statements on 2026-09-11 (1586 tests).
        # 80 leaves enough headroom that an ordinary change does not fail CI,
        # while still catching a real regression. Raise it as coverage grows.
        description: Minimum total line coverage percentage.
        type: number
        required: false
        default: 80

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must cover every version pyproject advertises in its classifiers.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json

      - name: Dashboard bundle check
        run: python scripts/build_dashboard_ui.py --check

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/janus/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check src/janus/ tests/ scripts/

      - name: Mypy
        run: mypy src/janus/ scripts/

      - name: Pytest with coverage
        run: |
          python -m pytest -q \
            --cov=src/janus \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=${{ inputs.coverage-threshold }}

      - name: SQLite migration smoke
        run: python scripts/migration_smoke.py

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          f = pathlib.Path("coverage.xml")
          if not f.exists():
              print("No coverage report produced.")
          else:
              rate = float(ET.parse(f).getroot().get("line-rate", 0)) * 100
              print(f"### Coverage (Python ${{ matrix.python-version }})\n\n**{rate:.2f}%** line coverage")
          PY

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Docs build (strict)
        run: mkdocs build --strict

  browser:
    # Browser regression suite for the dashboard SPA (#110). Drives a real
    # Chromium against a running Janus instance: every route renders, no
    # secret lands in the DOM, back/forward navigation, filters, server-side
    # pagination, and a reversible CRUD mutation.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install playwright

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run browser regression suite
        run: |
          python - <<'PY'
          import pathlib, yaml
          models = lambda p: [f"{p}-model-{i:03d}" for i in range(35)]
          cfg = {
              "server": {
                  "host": "127.0.0.1",
                  "port": 20131,
                  "data_dir": "/tmp/janus-browser-test",
                  "require_api_key": True,
              },
              "providers": [
                  {
                      "id": "openai",
                      "prefix": "openai",
                      "api_type": "openai_compat",
                      "base_url": "https://api.openai.example/v1",
                      "api_key": "sk-fake-openai-not-real",
                      "models": models("openai"),
                  },
                  {
                      "id": "anthropic",
                      "prefix": "anthropic",
                      "api_type": "openai_compat",
                      "base_url": "https://api.anthropic.example/v1",
                      "api_key": "sk-fake-anthropic-not-real",
                      "models": models("anthropic"),
                  },
              ],
          }
          pathlib.Path("/tmp/janus-browser-test").mkdir(exist_ok=True)
          pathlib.Path("/tmp/janus-browser-config.yaml").write_text(
              yaml.safe_dump(cfg, default_flow_style=False)
          )
          print("config written")
          PY

          janus serve --port 20131 --config /tmp/janus-browser-config.yaml &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:20131/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:20131/v1/health || { echo "server did not become healthy"; exit 1; }

          KEY=$(janus keys create --name browser-test --config /tmp/janus-browser-config.yaml \
            | grep -ioE 'sk-janus-[0-9a-f]+' | head -1)
          test -n "$KEY" || { echo "failed to create dashboard key"; exit 1; }

          JANUS_SMOKE_BASE_URL=http://127.0.0.1:20131 JANUS_SMOKE_API_KEY="$KEY" \
            python scripts/browser_regression.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          pip install build twine
          python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Verify the wheel ships the dashboard bundle
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "janus/dashboard/static/app/index.html",
              "janus/dashboard/static/app/_app/version.json",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel {wheel.name} is missing: {missing}")
          print(f"{wheel.name}: dashboard bundle present ({len(names)} entries)")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
