name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  # A tag used to publish without running CI at all: v3.14.0 reached PyPI
  # 2m21s before CI on main finished. Publishing now depends on the same
  # checks a pull request faces.
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the tag matches the packaged version
        run: |
          python - <<'PY'
          import ast, json, os, pathlib, sys
          tag = os.environ["GITHUB_REF_NAME"]
          module = ast.parse(pathlib.Path("src/janus/__init__.py").read_text(encoding="utf-8"))
          version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          dashboard_version = json.loads(
              pathlib.Path("dashboard-ui/package.json").read_text(encoding="utf-8")
          )["version"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match project version {version}")
          if dashboard_version != version:
              sys.exit(
                  f"dashboard package version {dashboard_version} does not match release version {version}"
              )
          print(f"tag {tag} and dashboard package match project version {version}")
          PY

      - name: Install build tool
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
