name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the tag matches the packaged version
        run: |
          python - <<'PY'
          import ast, json, os, pathlib, sys
          tag = os.environ["GITHUB_REF_NAME"]
          module = ast.parse(pathlib.Path("src/janus/__init__.py").read_text(encoding="utf-8"))
          version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          dashboard_version = json.loads(
              pathlib.Path("dashboard-ui/package.json").read_text(encoding="utf-8")
          )["version"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match project version {version}")
          if dashboard_version != version:
              sys.exit(
                  f"dashboard package version {dashboard_version} does not match release version {version}"
              )
          print(f"tag {tag} and dashboard package match project version {version}")
          PY

  checks:
    needs: version
    uses: ./.github/workflows/checks.yml

  docker:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      publish: true

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
