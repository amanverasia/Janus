services:
  janus:
    build: .
    ports:
      - "20128:20128"
    volumes:
      - ./janus-data:/home/janus/.janus
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JANUS_ANTIGRAVITY_CLIENT_ID=${JANUS_ANTIGRAVITY_CLIENT_ID:-}
      - JANUS_ANTIGRAVITY_CLIENT_SECRET=${JANUS_ANTIGRAVITY_CLIENT_SECRET:-}
      - JANUS_GOOGLE_CLI_CLIENT_ID=${JANUS_GOOGLE_CLI_CLIENT_ID:-}
      - JANUS_GOOGLE_CLI_CLIENT_SECRET=${JANUS_GOOGLE_CLI_CLIENT_SECRET:-}
      - INVENTORY_ENCRYPTION_KEY=${INVENTORY_ENCRYPTION_KEY:-}
      - INVENTORY_ENCRYPTION_PREVIOUS_KEY=${INVENTORY_ENCRYPTION_PREVIOUS_KEY:-}
      - INVENTORY_PUSH_TOKEN=${INVENTORY_PUSH_TOKEN:-}
      - JANUS_ALLOW_INSECURE_DEV_KEY=${JANUS_ALLOW_INSECURE_DEV_KEY:-}
    restart: unless-stopped
