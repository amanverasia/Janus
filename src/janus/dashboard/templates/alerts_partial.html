<div id="attention" class="bg-gray-800 rounded-xl border border-gray-700 mb-8 overflow-hidden">
    <div class="px-5 py-4 border-b border-gray-700 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-white">Attention needed</h2>
        <span class="text-xs text-gray-400">{{ global_alerts|length }} item(s)</span>
    </div>
    <ul class="divide-y divide-gray-700">
        {% for alert in global_alerts %}
        <li class="px-5 py-3 flex items-start gap-3 hover:bg-gray-700/40">
            <span class="mt-0.5 shrink-0 text-sm
                {% if alert.severity == 'critical' %}text-red-400
                {% elif alert.severity == 'warning' %}text-amber-400
                {% else %}text-blue-400{% endif %}">
                {% if alert.severity == 'critical' %}●{% elif alert.severity == 'warning' %}●{% else %}○{% endif %}
            </span>
            <div class="flex-1 min-w-0">
                <a href="{{ alert.href }}" class="text-white font-medium hover:text-blue-300">{{ alert.title }}</a>
                <p class="text-gray-400 text-sm mt-0.5">{{ alert.detail }}</p>
            </div>
            <a href="{{ alert.href }}" class="shrink-0 text-xs text-blue-400 hover:text-blue-300">Fix →</a>
        </li>
        {% endfor %}
    </ul>
</div>
