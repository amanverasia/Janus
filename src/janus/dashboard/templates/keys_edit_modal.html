<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70" onclick="if(event.target===this)closeKeyEditor()">
    <div class="bg-gray-800 border border-gray-700 rounded-xl w-full max-w-lg max-h-[85vh] overflow-y-auto" onclick="event.stopPropagation()">
        <div class="sticky top-0 bg-gray-800 border-b border-gray-700 px-6 py-4 flex items-center justify-between">
            <div>
                <h2 class="text-lg font-semibold text-white">Edit API Key</h2>
                <p class="text-xs text-gray-400 mt-0.5">{{ key.prefix }}… · ID #{{ key.id }}</p>
            </div>
            <button type="button" onclick="closeKeyEditor()"
                    class="text-gray-400 hover:text-white text-xl leading-none cursor-pointer">&times;</button>
        </div>
        <div id="keys-edit-body" class="p-6">
            <form method="post"
                  action="/dashboard/api/keys/{{ key.id }}{% if status %}?status={{ status }}{% endif %}"
                  hx-post="/dashboard/api/keys/{{ key.id }}{% if status %}?status={{ status }}{% endif %}"
                  hx-target="#keys-content"
                  hx-swap="innerHTML"
                  hx-sync="#keys-content:replace"
                  hx-on::after-request="if(event.detail.successful) closeKeyEditor()"
                  class="space-y-4">
                <input type="hidden" name="login_field" value="1">
                <input type="hidden" name="models_field" value="1">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Name</label>
                    <input type="text" name="name" value="{{ key.name }}"
                           class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer">
                    <input type="checkbox" name="can_login" value="on"
                           {% if key.can_login %}checked{% endif %}
                           class="rounded border-gray-600 bg-gray-900 text-blue-600 focus:ring-blue-500">
                    Allow dashboard login
                </label>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Allowed models (empty = all)</label>
                    <textarea name="allowed_models" rows="3"
                              placeholder="openai/gpt-4o, openai/*, my-combo"
                              class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 font-mono text-sm">{{ models_text }}</textarea>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Daily budget USD (optional)</label>
                    <input type="number" name="daily_budget" step="0.01" min="0"
                           value="{{ daily_budget }}"
                           placeholder="e.g. 5.00"
                           class="w-full sm:w-48 bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
                    {% if daily_budget %}
                    <p class="text-xs text-gray-500 mt-1">Leave unchanged to keep current budget.</p>
                    {% else %}
                    <p class="text-xs text-gray-500 mt-1">Set a daily spend limit for this key.</p>
                    {% endif %}
                </div>
                <div class="flex items-center justify-end gap-2 pt-4 border-t border-gray-700">
                    <button type="button" onclick="closeKeyEditor()"
                            class="px-4 py-2 border border-gray-600 text-gray-300 hover:bg-gray-700 rounded-lg text-sm cursor-pointer">
                        Cancel
                    </button>
                    <button type="submit"
                            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium cursor-pointer">
                        Save changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
