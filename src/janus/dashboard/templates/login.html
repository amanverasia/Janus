<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Janus</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
    <link rel="stylesheet" href="/dashboard/static/css/login.css">
</head>
<body>
    <main class="login-card">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">J</span>
            <div>
                <span class="eyebrow">Janus control plane</span>
                <h1>Sign in</h1>
            </div>
        </div>
        <p class="intro">
            Sign in with a Janus API key that has dashboard access enabled.
        </p>
        {% if error %}
        <div class="error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/dashboard/login">
            <input type="hidden" name="next" value="{{ next }}">
            <label for="api-key">API key</label>
            <div class="field">
                <input type="password" name="api_key" required autofocus autocomplete="off"
                       id="api-key" placeholder="sk-janus-...">
            </div>
            <button type="submit">Continue to dashboard</button>
        </form>
    </main>
</body>
</html>
