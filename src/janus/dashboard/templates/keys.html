{% extends "base.html" %}
{% block title %}API Keys - Janus{% endblock %}
{% block keys_active %}bg-gray-700 text-white{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6 gap-4 flex-wrap">
    <h1 class="text-2xl font-bold text-white">API Keys</h1>
    <button type="button" id="keys-create-toggle"
            class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-sm transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New Key
    </button>
</div>

<!-- Create Form (collapsible) -->
<div id="keys-create-panel" class="hidden bg-gray-800 rounded-xl p-6 border border-gray-700 mb-6">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-white">Create New Key</h2>
        <button type="button" onclick="document.getElementById('keys-create-panel').classList.add('hidden')"
                class="text-gray-400 hover:text-white text-xl leading-none cursor-pointer">&times;</button>
    </div>
    <form hx-post="/dashboard/api/keys"
          hx-target="#keys-content"
          hx-swap="innerHTML"
          hx-on::after-request="document.getElementById('keys-create-panel').classList.add('hidden')"
          class="space-y-4">
        <input type="hidden" name="login_field" value="1">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
            <input type="text"
                   name="name"
                   placeholder="Key name (e.g. production)"
                   required
                   class="flex-1 bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
            <button type="submit"
                    class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-sm transition-colors cursor-pointer">
                Generate Key
            </button>
        </div>
        <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer">
            <input type="checkbox" name="can_login" value="on" checked
                   class="rounded border-gray-600 bg-gray-900 text-blue-600 focus:ring-blue-500">
            Allow dashboard login
        </label>
        <div>
            <label class="block text-sm text-gray-400 mb-1">Allowed models (empty = all)</label>
            <textarea name="allowed_models"
                      rows="2"
                      placeholder="openai/gpt-4o, openai/*, my-combo"
                      class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 font-mono text-sm"></textarea>
        </div>
        <div>
            <label class="block text-sm text-gray-400 mb-1">Daily budget USD (optional)</label>
            <input type="number"
                   name="daily_budget"
                   step="0.01"
                   min="0"
                   placeholder="e.g. 5.00"
                   class="w-full sm:w-48 bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
        </div>
    </form>
</div>

<div id="keys-content" data-status="{{ status|default('active') }}">
    {% include "keys_partial.html" %}
</div>

<div id="keys-edit-modal" class="hidden"></div>

<script>
(function () {
    var toggle = document.getElementById('keys-create-toggle');
    var panel = document.getElementById('keys-create-panel');
    if (toggle && panel) {
        toggle.addEventListener('click', function () {
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                var name = panel.querySelector('[name=name]');
                if (name) name.focus();
            }
        });
    }
    window.openKeyEditor = function (keyId) {
        var modal = document.getElementById('keys-edit-modal');
        if (!modal) return;
        var body = modal.querySelector('#keys-edit-body');
        if (body) body.innerHTML = '<div class="flex items-center justify-center py-12 text-gray-400 text-sm">Loading…</div>';
        modal.classList.remove('hidden');
        fetch('/dashboard/api/keys/' + keyId + '/edit', { headers: { 'HX-Request': 'true' } })
            .then(function (r) { return r.text(); })
            .then(function (html) {
                modal.innerHTML = html;
            })
            .catch(function () {
                if (window.janusToast) janusToast('Failed to load key', 'error');
                modal.classList.add('hidden');
            });
    };
    window.closeKeyEditor = function () {
        var modal = document.getElementById('keys-edit-modal');
        if (modal) modal.classList.add('hidden');
    };
})();
</script>
{% endblock %}
